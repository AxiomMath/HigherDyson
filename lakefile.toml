name = "HigherDyson"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["HigherDyson"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0"

[[lean_lib]]
name = "HigherDyson"
globs = ["Batch1.+", "Batch2.+", "Batch3.+", "Batch4.+"]
